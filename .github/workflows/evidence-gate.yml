name: evidence-gate

on:
  pull_request:
    paths:
      - 'docs/audits/**'
      - 'tools/ci/**'
      - '.github/workflows/evidence-gate.yml'
  workflow_dispatch: {}

concurrency:
  group: evidence-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-gate:
    runs-on: [self-hosted, macOS, ARM64]  # 2026-10-14 迁公司 CI Mac 专机 mac-<repo>-01
    # 公开仓防线：fork 来的 PR 不落自托管机（现 0 fork；真出现时走人工批准/hosted）
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 证据引用完整性门（仅新增审计文档）
        run: |
          BASE=$(git merge-base "origin/${{ github.base_ref || 'main' }}" HEAD)
          python3 tools/ci/evidence-integrity-check.py . HEAD --only-added "$BASE" \
            --cross-names public-ai,leads-engine,touch-engine,product-image-engine,shuhai-guanlan,guanlan-order,aicut,GoBoost
